<!doctype html>
<!--
  Source for public/og-image.png, the 1200x630 link-preview card.
  Regenerate on Windows (from the pace folder):
  "C:\Program Files\Google\Chrome\Application\chrome.exe" --headless=new --hide-scrollbars --force-device-scale-factor=1 --window-size=1200,630 --screenshot="%CD%\public\og-image.png" "%CD%\scripts\og-image.html"
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      body {
        background: #16181d;
        color: #ece9e1;
        font-family: Georgia, "Iowan Old Style", "Palatino Linotype", serif;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 0 96px;
        box-sizing: border-box;
        position: relative;
      }
      .mark {
        display: flex;
        align-items: center;
        gap: 22px;
      }
      .mark svg {
        width: 72px;
        height: 72px;
      }
      .name {
        font-size: 64px;
        letter-spacing: -1px;
        line-height: 1;
      }
      .tagline {
        margin-top: 44px;
        font-size: 64px;
        line-height: 1.08;
        max-width: 980px;
        letter-spacing: -1px;
      }
      .sub {
        margin-top: 28px;
        font-family: "Segoe UI", system-ui, sans-serif;
        font-size: 28px;
        color: #a9b0ad;
      }
      .line {
        position: absolute;
        left: 96px;
        right: 96px;
        bottom: 72px;
        height: 70px;
      }
    </style>
  </head>
  <body>
    <div class="mark">
      <svg viewBox="0 0 32 32" aria-hidden="true" fill="none">
        <path d="M4 21 C 10 10, 18 10, 28 13" stroke="#5fc3b4" stroke-width="3.4" stroke-linecap="round" />
        <circle cx="20" cy="11.6" r="4.6" fill="#16181d" stroke="#5fc3b4" stroke-width="3" />
        <circle cx="28" cy="13" r="2.2" fill="#5fc3b4" />
      </svg>
      <div class="name">Pace</div>
    </div>
    <div class="tagline">A planner that plans around how you actually feel.</div>
    <div class="sub">Move one dial and the day resizes. Free, no sign-up. planwithpace.app</div>
    <svg class="line" viewBox="0 0 1008 70" preserveAspectRatio="none" aria-hidden="true" fill="none">
      <path d="M8 52 C 250 20, 500 8, 1000 26" stroke="#2b3139" stroke-width="4" stroke-linecap="round" stroke-dasharray="1 10" />
      <path d="M8 52 C 180 30, 360 18, 640 20" stroke="#5fc3b4" stroke-width="7" stroke-linecap="round" opacity="0.55" />
      <circle cx="120" cy="40" r="12" fill="#5fc3b4" />
      <circle cx="260" cy="28" r="14" fill="#16181d" stroke="#c9a2ff" stroke-width="5" />
      <circle cx="420" cy="20" r="16" fill="#16181d" stroke="#f0b35b" stroke-width="5" />
      <circle cx="560" cy="18" r="12" fill="#16181d" stroke="#7fcf8f" stroke-width="5" />
      <circle cx="640" cy="20" r="7" fill="#16181d" stroke="#5fc3b4" stroke-width="3" />
    </svg>
  </body>
</html>
